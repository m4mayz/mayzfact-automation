[project]
name = "mayzfact"
version = "0.1.0"
description = "Pipeline shorts: naskah ulang + TTS + klip stock"
requires-python = ">=3.12"
dependencies = [
  "google-api-python-client>=2.201.0",
  "google-auth-oauthlib>=1.5.0",
  "httpx>=0.28",
  "numpy>=2.0",
  "open-clip-torch>=3.0",
  "pillow>=11",
  "playwright>=1.55",
  "pydantic>=2.9",
  "python-dotenv>=1.0",
  "torch>=2.9",
  "transformers>=4.40",
  "youtube-transcript-api>=1.2",
  "yt-dlp>=2026.8.19",
]

[project.scripts]
mayzfact = "mayzfact.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mayzfact"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not render and not clip'"
markers = [
  "render: jalanin Remotion beneran (lambat, butuh Node 22)",
  "clip: load model ML asli SigLIP/OWLv2 (lambat; model ada di models/)",
]
